
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#764ba2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flash Card">
<title>Flash Card คำศัพท์</title>

<style>
:root { --p:#764ba2; --p2:#667eea; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,'Sarabun','Segoe UI',Tahoma,sans-serif;
  background:linear-gradient(160deg,var(--p2),var(--p));
  color:#333; min-height:100vh; min-height:100dvh;
  overscroll-behavior:none; touch-action:manipulation;
}
header { padding:calc(env(safe-area-inset-top) + 12px) 16px 10px; color:#fff; text-align:center; }
header h1 { font-size:1.25rem; }
header .date { font-size:.8rem; opacity:.85; margin-top:2px; }
main { max-width:560px; margin:0 auto; padding:0 12px calc(84px + env(safe-area-inset-bottom)); }
.panel { display:none; background:#fff; border-radius:20px; padding:16px; box-shadow:0 8px 24px rgba(0,0,0,.18); }
.panel.active { display:block; }

.tabbar {
  position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex;
  background:#fff; border-top:1px solid #e6e6e6; padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button {
  flex:1; border:none; background:none; padding:8px 0 6px; font-family:inherit;
  font-size:.75rem; color:#999; display:flex; flex-direction:column; align-items:center; gap:2px;
}
.tabbar .ic { font-size:1.45rem; }
.tabbar button.active { color:var(--p); font-weight:bold; }

.stats { display:flex; justify-content:space-around; text-align:center; margin-bottom:12px; }
.stats b { display:block; font-size:1.4rem; color:var(--p); }
.stats span { font-size:.75rem; color:#888; }

.scene {
  position:relative; perspective:1000px; height:50vh; height:min(50dvh,380px); min-height:240px;
  margin-bottom:8px; touch-action:pan-y; user-select:none; -webkit-user-select:none;
}
.card { position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d; }
.card.flipped { transform:rotateY(180deg); }
.face {
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; text-align:center;
}
.front { background:linear-gradient(135deg,#f6f9ff,#e6ecff); border:2px solid #c9d4ff; }
.back { background:linear-gradient(135deg,#fff8e8,#ffeccc); border:2px solid #ffd27f; transform:rotateY(180deg); }
.word { font-size:2.3rem; font-weight:bold; word-break:break-word; }
.meaning { font-size:1.8rem; color:#b06b00; margin-top:8px; word-break:break-word; }
.small { font-size:.95rem; color:#888; }
.badge { position:absolute; top:12px; left:12px; font-size:.75rem; background:var(--p); color:#fff; padding:4px 10px; border-radius:20px; }
.speak { position:absolute; top:6px; right:6px; width:48px; height:48px; background:none; border:none; font-size:1.6rem; }
.stamp {
  position:absolute; top:50px; z-index:5; padding:6px 14px; border:3px solid; border-radius:10px;
  font-weight:bold; font-size:1.3rem; opacity:0; pointer-events:none; background:rgba(255,255,255,.9);
}
.stamp.yes { left:16px; color:#2e9e5b; border-color:#2e9e5b; transform:rotate(-12deg); }
.stamp.no { right:16px; color:#e04848; border-color:#e04848; transform:rotate(12deg); }
.hint { text-align:center; color:#999; font-size:.8rem; margin-bottom:12px; }
.actions { display:flex; gap:10px; }
.btn {
  flex:1; min-height:56px; padding:14px; border:none; border-radius:14px; font-size:1.1rem;
  font-family:inherit; color:#fff; font-weight:bold;
}
.btn:active { transform:scale(.97); opacity:.9; }
.btn-no { background:#ef5a5a; }
.btn-yes { background:#34b46a; }
.btn-main { background:var(--p); width:100%; }
.btn-light { background:#f0f0f0; color:#444; font-weight:normal; font-size:.95rem; min-height:48px; }
.empty { text-align:center; padding:40px 10px; }
.empty .big { font-size:3.2rem; }
.empty p { margin-top:10px; color:#666; }

h3 { font-size:1.1rem; }
label { display:block; margin:12px 0 4px; font-weight:bold; font-size:.95rem; }
input[type=text], input[type=search], textarea {
  width:100%; padding:12px; border:1.5px solid #ccc; border-radius:12px;
  font-size:16px; font-family:inherit; background:#fff; -webkit-appearance:none;
}
input:focus, textarea:focus { outline:none; border-color:var(--p); }
textarea { min-height:140px; resize:vertical; }
.row { margin-top:14px; }
hr { border:none; border-top:1px dashed #ddd; margin:22px 0; }
.msg { margin-top:10px; font-size:.9rem; min-height:1.2em; }
.ok { color:#2e9e5b; }
.err { color:#d33; }

.tools { display:flex; gap:8px; margin:10px 0; }
.tools .btn { flex:1; }
.item { border-bottom:1px solid #eee; padding:12px 2px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.item .w { font-weight:bold; font-size:1.05rem; }
.item .m { color:#555; }
.item .info { font-size:.75rem; color:#999; margin-top:3px; }
.item-btns { display:flex; gap:4px; flex-shrink:0; }
.item-btns button { width:40px; height:40px; border:none; background:#f2f2f2; border-radius:10px; font-size:1.05rem; }
</style>
</head>

<body>

<header>
  <h1>📚 Flash Card คำศัพท์</h1>
  <div class="date" id="todayText"></div>
</header>

<main>

<section class="panel active" id="review">

  <div class="stats">
    <div><b id="statLeft">0</b><span>เหลือวันนี้</span></div>
    <div><b id="statDone">0</b><span>ทวนแล้ววันนี้</span></div>
    <div><b id="statTotal">0</b><span>คำทั้งหมด</span></div>
  </div>

  <div id="reviewArea">
    <div class="scene" id="scene">
      <div class="stamp yes" id="stampYes">จำได้ ✓</div>
      <div class="stamp no" id="stampNo">จำไม่ได้ ✗</div>

      <div class="card" id="card">
        <div class="face front">
          <span class="badge" id="badge"></span>
          <button class="speak" id="speakBtn" aria-label="ฟังเสียง">🔊</button>
          <div class="word" id="frontWord"></div>
        </div>

        <div class="face back">
          <div class="small" id="backWord"></div>
          <div class="meaning" id="backMeaning"></div>
        </div>
      </div>
    </div>

    <div class="hint">แตะเพื่อดูคำแปล · ปัดขวา = จำได้ · ปัดซ้าย = จำไม่ได้</div>

    <div class="actions">
      <button class="btn btn-no" id="btnNo">❌ จำไม่ได้</button>
      <button class="btn btn-yes" id="btnYes">✅ จำได้</button>
    </div>
  </div>

  <div class="empty" id="emptyArea" style="display:none">
    <div class="big">🎉</div>
    <h2 id="emptyTitle"></h2>
    <p id="emptyText"></p>
  </div>

</section>

<section class="panel" id="add">

  <h3>เพิ่มทีละคำ</h3>

  <label for="inWord">คำศัพท์ภาษาอังกฤษ</label>
  <input type="text" id="inWord" placeholder="เช่น apple" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next">

  <label for="inMeaning">คำแปล</label>
  <input type="text" id="inMeaning" placeholder="เช่น แอปเปิล" autocomplete="off" enterkeyhint="done">

  <div class="row"><button class="btn btn-main" id="btnAdd">➕ เพิ่มคำศัพท์</button></div>
  <div class="msg" id="addMsg"></div>

  <hr>

  <h3>เพิ่มทีละหลายคำ</h3>
  <p class="small" style="margin-top:6px">บรรทัดละ 1 คำ ในรูปแบบ <b>คำศัพท์ = คำแปล</b></p>

  <textarea id="inBulk" placeholder="apple = แอปเปิล&#10;book = หนังสือ&#10;run = วิ่ง" autocapitalize="off" autocorrect="off" spellcheck="false" style="margin-top:8px"></textarea>

  <div class="row"><button class="btn btn-main" id="btnBulk">➕ เพิ่มทั้งหมด</button></div>
  <div class="msg" id="bulkMsg"></div>

</section>

<section class="panel" id="library">

  <input type="search" id="search" placeholder="🔍 ค้นหาคำศัพท์..." autocapitalize="off" autocorrect="off">

  <div class="tools">
    <button class="btn btn-light" id="btnExport">💾 สำรองข้อมูล</button>
    <button class="btn btn-light" id="btnImport">📂 นำเข้า</button>
    <input type="file" id="fileImport" accept=".json,application/json,text/plain" style="display:none">
  </div>

  <div class="small" id="libCount" style="margin-bottom:4px"></div>
  <div id="list"></div>

</section>
</main>

<nav class="tabbar">
  <button class="active" data-tab="review"><span class="ic">🃏</span>ทบทวน</button>
  <button data-tab="add"><span class="ic">➕</span>เพิ่มคำ</button>
  <button data-tab="library"><span class="ic">📖</span>คลังคำ</button>
</nav>

<script>

/* ================= ตั้งค่า ================= */

const STORAGE_KEY = 'flashcards_v1';
const STEP = 5;
const INTERVALS = [1, 2, 3];

// จำนวนการ์ดที่จะผ่านก่อนนำคำที่จำไม่ได้กลับมา
const RETRY_GAP = 2;

/* ================= ข้อมูล ================= */

let words = load();
let queue = [];
let retryQueue = [];
let current = null;
let busy = false;

function load() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    return data.map(w => ({
      ...w,
      wrongCount: w.wrongCount || 0
    }));

  } catch (e) {
    return [];
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
}

const $ = id => document.getElementById(id);

/* ================= วันที่ ================= */

function fmt(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function today() {
  return fmt(new Date());
}

function addDays(str, n) {
  const [y, m, d] = str.split('-').map(Number);
  return fmt(new Date(y, m - 1, d + n));
}

function thaiDate(str) {
  const [y, m, d] = str.split('-').map(Number);

  return new Date(y, m - 1, d).toLocaleDateString('th-TH', {
    weekday: 'long',
    day: 'numeric',
    month: 'long'
  });
}

let currentDay = today();

/* ================= ระบบทบทวน ================= */

function intervalFor(streak) {
  const level = Math.min(
    Math.floor(streak / STEP),
    INTERVALS.length - 1
  );

  return INTERVALS[level];
}

function isDue(w) {
  const t = today();
  return w.nextDue <= t && w.lastReviewed !== t;
}

// จัดลำดับคำที่ยากก่อน
function sortDifficult(a) {
  return a.sort((x, y) => {

    // จำไม่ได้มากกว่า = มาก่อน
    if (y.wrongCount !== x.wrongCount) {
      return y.wrongCount - x.wrongCount;
    }

    // ถ้าจำนวนครั้งที่จำไม่ได้เท่ากัน
    // ให้คำที่จำได้ติดกันน้อยกว่ามาก่อน
    if (x.streak !== y.streak) {
      return x.streak - y.streak;
    }

    return Math.random() - 0.5;
  });
}

// สร้างคิวคำศัพท์ประจำวัน
function buildQueue() {

  $('todayText').textContent = thaiDate(today());

  if (current && !words.includes(current)) {
    current = null;
  }

  queue = sortDifficult(
    words.filter(w => isDue(w) && w !== current)
  );

  retryQueue = [];

  if (!current) {
    nextCard();
  } else {
    updateStats();
  }
}

/* ================= ระบบนำคำกลับมาซ้ำ ================= */

// ลดจำนวนการ์ดที่ต้องผ่านของคำที่รอทบทวน
function decreaseRetryWait() {
  retryQueue.forEach(item => {
    item.wait--;
  });
}

// หาคำที่พร้อมกลับมาทบทวน
function getReadyRetry() {

  const ready = retryQueue.filter(item => item.wait <= 0);

  if (ready.length === 0) return null;

  // คำที่จำไม่ได้บ่อยกว่าจะมาก่อน
  ready.sort((a, b) => {
    return b.word.wrongCount - a.word.wrongCount;
  });

  const selected = ready[0];

  retryQueue.splice(
    retryQueue.indexOf(selected),
    1
  );

  return selected.word;
}

/* ================= การ์ดถัดไป ================= */

function nextCard() {

  // 1. ให้คำที่จำไม่ได้และครบระยะรอกลับมาก่อน
  let retry = getReadyRetry();

  if (retry) {
    current = retry;
  }

  // 2. ถ้าไม่มีคำที่พร้อมซ้ำ ให้เอาคำปกติมาก่อน
  else if (queue.length > 0) {
    current = queue.shift();
  }

  // 3. ถ้าคำปกติหมดแล้ว ให้นำคำที่รออยู่กลับมา
  else if (retryQueue.length > 0) {

    retryQueue.sort((a, b) => {
      return a.wait - b.wait ||
        b.word.wrongCount - a.word.wrongCount;
    });

    current = retryQueue.shift().word;
  }

  else {
    current = null;
  }

  resetFlip();
  resetScene();
  updateStats();

  if (!current) {

    $('reviewArea').style.display = 'none';
    $('emptyArea').style.display = 'block';

    if (words.length === 0) {

      $('emptyTitle').textContent = 'ยังไม่มีคำศัพท์';
      $('emptyText').textContent =
        'กด "➕ เพิ่มคำ" ด้านล่างเพื่อเริ่มต้นได้เลย';

    } else {

      $('emptyTitle').textContent = 'ทบทวนครบแล้ววันนี้!';

      const t = today();

      const next = w =>
        w.nextDue > t ? w.nextDue : addDays(t, 1);

      const upcoming = words.map(next).sort()[0];

      const count = words.filter(
        w => next(w) === upcoming
      ).length;

      $('emptyText').textContent =
        `รอบถัดไป: ${thaiDate(upcoming)} (${count} คำ)`;
    }

    return;
  }

  $('reviewArea').style.display = 'block';
  $('emptyArea').style.display = 'none';

  $('frontWord').textContent = current.word;
  $('backWord').textContent = current.word;
  $('backMeaning').textContent = current.meaning;

  // ป้ายแสดงสถานะ
  if (current.wrongCount > 0) {

    $('badge').textContent =
      `⚠️ จำไม่ได้ ${current.wrongCount} ครั้ง`;

  } else if (current.streak === 0) {

    $('badge').textContent = 'คำใหม่ / เริ่มใหม่';

  } else {

    $('badge').textContent =
      `จำได้ติดกัน ${current.streak} ครั้ง`;
  }
}

/* ================= การตอบคำศัพท์ ================= */

function answer(remembered) {

  if (!current) return;

  const t = today();
  const answeredWord = current;

  // ทุกครั้งที่ตอบ ให้ลดเวลารอของคำอื่น
  decreaseRetryWait();

  if (remembered) {

    // จำได้
    answeredWord.streak += 1;
    answeredWord.wrongCount = 0;

    answeredWord.nextDue = addDays(
      t,
      intervalFor(answeredWord.streak)
    );

    answeredWord.lastReviewed = t;

  } else {

    // จำไม่ได้
    answeredWord.streak = 0;
    answeredWord.wrongCount += 1;

    answeredWord.nextDue = addDays(t, 1);
    answeredWord.lastReviewed = t;

    // นำกลับมาเข้าคิวซ้ำหลังผ่านไป 2 ใบ
    retryQueue.push({
      word: answeredWord,
      wait: RETRY_GAP
    });
  }

  save();

  current = null;

  nextCard();
}

/* ================= สถิติ ================= */

function updateStats() {

  const t = today();

  $('statLeft').textContent =
    queue.length +
    retryQueue.length +
    (current ? 1 : 0);

  $('statDone').textContent =
    words.filter(w => w.lastReviewed === t).length;

  $('statTotal').textContent = words.length;
}

/* ================= การ์ด + ปัด ================= */

const card = $('card');
const scene = $('scene');

function resetFlip() {

  card.style.transition = 'none';
  card.classList.remove('flipped');

  void card.offsetWidth;

  card.style.transition = '';
}

function resetScene() {

  scene.style.transition = 'none';
  scene.style.transform = '';

  $('stampYes').style.opacity = 0;
  $('stampNo').style.opacity = 0;
}

function showStamp(dx) {

  const o = Math.min(Math.abs(dx) / 90, 1);

  $('stampYes').style.opacity = dx > 0 ? o : 0;
  $('stampNo').style.opacity = dx < 0 ? o : 0;
}

function flyOut(yes) {

  if (busy || !current) return;

  busy = true;

  if (navigator.vibrate) navigator.vibrate(15);

  showStamp(yes ? 100 : -100);

  scene.style.transition = 'transform .25s ease-out';

  scene.style.transform =
    `translateX(${yes ? 120 : -120}vw) rotate(${yes ? 25 : -25}deg)`;

  setTimeout(() => {

    answer(yes);
    busy = false;

  }, 230);
}

let sx = 0, sy = 0, dx = 0;
let tracking = false, moved = false;

scene.addEventListener('touchstart', e => {

  if (busy || !current) return;

  const t = e.touches[0];

  sx = t.clientX;
  sy = t.clientY;
  dx = 0;

  tracking = true;
  moved = false;

  scene.style.transition = 'none';

}, { passive: true });

scene.addEventListener('touchmove', e => {

  if (!tracking) return;

  const t = e.touches[0];

  dx = t.clientX - sx;

  const dy = t.clientY - sy;

  if (!moved) {

    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;

    if (Math.abs(dy) > Math.abs(dx)) {
      tracking = false;
      return;
    }

    moved = true;
  }

  e.preventDefault();

  scene.style.transform =
    `translateX(${dx}px) rotate(${dx / 18}deg)`;

  showStamp(dx);

}, { passive: false });

scene.addEventListener('touchend', () => {

  if (!tracking) return;

  tracking = false;

  if (!moved) return;

  if (Math.abs(dx) > 90) {

    flyOut(dx > 0);

  } else {

    scene.style.transition = 'transform .2s';
    scene.style.transform = '';
    showStamp(0);
  }

});

scene.addEventListener('click', () => {

  if (moved) {
    moved = false;
    return;
  }

  if (!busy) card.classList.toggle('flipped');

});

$('speakBtn').addEventListener('touchstart', e => {
  e.stopPropagation();
}, { passive: true });

$('speakBtn').addEventListener('click', e => {

  e.stopPropagation();

  if (!current || !window.speechSynthesis) return;

  const u = new SpeechSynthesisUtterance(current.word);

  u.lang = 'en-US';
  u.rate = 0.9;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);

});

$('btnYes').addEventListener('click', () => flyOut(true));
$('btnNo').addEventListener('click', () => flyOut(false));

/* ================= คีย์บอร์ด ================= */

document.addEventListener('keydown', e => {

  if (!$('review').classList.contains('active')) return;

  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

  if (e.code === 'Space') {
    e.preventDefault();
    card.classList.toggle('flipped');
  }

  if (e.key === 'ArrowRight') flyOut(true);
  if (e.key === 'ArrowLeft') flyOut(false);

});

/* ================= ข้ามวัน ================= */

document.addEventListener('visibilitychange', () => {

  if (document.visibilityState !== 'visible') return;

  if (today() !== currentDay) {

    currentDay = today();

    words = load();
    current = null;

    buildQueue();
  }

});

/* ================= เพิ่มคำศัพท์ ================= */

function addWord(word, meaning) {

  word = (word || '').trim();
  meaning = (meaning || '').trim();

  if (!word || !meaning) return 'empty';

  if (words.some(
    w => w.word.toLowerCase() === word.toLowerCase()
  )) return 'dup';

  words.push({

    id: Date.now().toString(36) +
      Math.random().toString(36).slice(2, 6),

    word,
    meaning,

    streak: 0,
    wrongCount: 0,

    nextDue: today(),
    lastReviewed: null,
    created: today()

  });

  return 'ok';
}

function setMsg(id, text, ok) {

  $(id).textContent = text;
  $(id).className = 'msg ' + (ok ? 'ok' : 'err');

}

$('btnAdd').addEventListener('click', () => {

  const w = $('inWord');
  const m = $('inMeaning');

  const r = addWord(w.value, m.value);

  if (r === 'ok') {

    save();

    setMsg('addMsg', `เพิ่ม "${w.value.trim()}" แล้ว ✔`, true);

    w.value = '';
    m.value = '';

    w.focus();

  } else if (r === 'dup') {

    setMsg('addMsg', 'มีคำนี้อยู่แล้ว', false);

  } else {

    setMsg('addMsg', 'กรุณากรอกทั้งคำศัพท์และคำแปล', false);

  }

});

$('inWord').addEventListener('keydown', e => {

  if (e.key === 'Enter') {
    e.preventDefault();
    $('inMeaning').focus();
  }

});

$('inMeaning').addEventListener('keydown', e => {

  if (e.key === 'Enter') {
    e.preventDefault();
    $('btnAdd').click();
  }

});

/* ================= เพิ่มหลายคำ ================= */

$('btnBulk').addEventListener('click', () => {

  const lines = $('inBulk').value.split('\n');

  let ok = 0, dup = 0, bad = 0;

  lines.forEach(line => {

    if (!line.trim()) return;

    const sep = line.includes('=')
      ? '='
      : (line.includes('\t') ? '\t' : null);

    if (!sep) {
      bad++;
      return;
    }

    const i = line.indexOf(sep);

    const r = addWord(
      line.slice(0, i),
      line.slice(i + 1)
    );

    if (r === 'ok') ok++;
    else if (r === 'dup') dup++;
    else bad++;

  });

  save();

  setMsg(
    'bulkMsg',
    `เพิ่มสำเร็จ ${ok} คำ` +
    (dup ? ` · ซ้ำ ${dup}` : '') +
    (bad ? ` · รูปแบบผิด ${bad}` : ''),
    ok > 0
  );

  if (ok) $('inBulk').value = '';

});

/* ================= คลังคำศัพท์ ================= */

function esc(s) {

  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));

}

function renderList() {

  const q = $('search').value.trim().toLowerCase();
  const t = today();

  const list = words
    .filter(w =>
      w.word.toLowerCase().includes(q) ||
      w.meaning.toLowerCase().includes(q)
    )
    .sort((a, b) => a.word.localeCompare(b.word));

  $('libCount').textContent =
    `ทั้งหมด ${words.length} คำ` +
    (q ? ` · พบ ${list.length} คำ` : '');

  $('list').innerHTML = list.map(w => {

    const iv = intervalFor(w.streak);

    const due = w.lastReviewed === t
      ? 'ทวนแล้ววันนี้'
      : (w.nextDue <= t
        ? 'ถึงกำหนดวันนี้'
        : 'รอบถัดไป ' + thaiDate(w.nextDue));

    return `<div class="item">

      <div>
        <div class="w">${esc(w.word)}</div>
        <div class="m">${esc(w.meaning)}</div>

        <div class="info">
          จำได้ติดกัน ${w.streak} ครั้ง
          · จำไม่ได้ ${w.wrongCount || 0} ครั้ง
          · มา${iv === 1 ? 'ทุกวัน' : 'ทุก ' + iv + ' วัน'}
          · ${due}
        </div>
      </div>

      <div class="item-btns">
        <button onclick="editWord('${w.id}')" aria-label="แก้ไข">✏️</button>
        <button onclick="resetWord('${w.id}')" aria-label="เริ่มนับใหม่">🔄</button>
        <button onclick="deleteWord('${w.id}')" aria-label="ลบ">🗑️</button>
      </div>

    </div>`;

  }).join('') ||
  '<p class="small" style="padding:24px;text-align:center">ไม่มีคำศัพท์</p>';

}

function editWord(id) {

  const w = words.find(x => x.id === id);

  if (!w) return;

  const nw = prompt('แก้ไขคำศัพท์', w.word);
  if (nw === null) return;

  const nm = prompt('แก้ไขคำแปล', w.meaning);
  if (nm === null) return;

  if (nw.trim()) w.word = nw.trim();
  if (nm.trim()) w.meaning = nm.trim();

  save();
  renderList();

}

function resetWord(id) {

  const w = words.find(x => x.id === id);

  if (!w) return;

  if (!confirm(`เริ่มนับ "${w.word}" ใหม่?`)) return;

  w.streak = 0;
  w.wrongCount = 0;
  w.nextDue = today();
  w.lastReviewed = null;

  save();
  renderList();

}

function deleteWord(id) {

  const w = words.find(x => x.id === id);

  if (!w) return;

  if (!confirm(`ลบ "${w.word}"?`)) return;

  words = words.filter(x => x.id !== id);

  retryQueue = retryQueue.filter(
    item => item.word.id !== id
  );

  queue = queue.filter(x => x.id !== id);

  if (current && current.id === id) {
    current = null;
  }

  save();
  renderList();
  updateStats();

}

$('search').addEventListener('input', renderList);

/* ================= สำรองข้อมูล ================= */

$('btnExport').addEventListener('click', async () => {

  const name = `flashcards-backup-${today()}.json`;

  const file = new File(
    [JSON.stringify(words, null, 2)],
    name,
    { type: 'application/json' }
  );

  if (navigator.canShare && navigator.canShare({ files: [file] })) {

    try {

      await navigator.share({
        files: [file],
        title: 'สำรองคำศัพท์'
      });

      return;

    } catch (e) {

      if (e.name === 'AbortError') return;

    }

  }

  const a = document.createElement('a');

  a.href = URL.createObjectURL(file);
  a.download = name;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(a.href), 1000);

});

/* ================= นำเข้าข้อมูล ================= */

$('btnImport').addEventListener('click', () => {
  $('fileImport').click();
});

$('fileImport').addEventListener('change', e => {

  const file = e.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {

    try {

      const data = JSON.parse(reader.result);

      if (!Array.isArray(data)) throw 0;

      let added = 0;

      data.forEach(d => {

        if (!d.word || !d.meaning) return;

        if (words.some(
          w => w.word.toLowerCase() === d.word.toLowerCase()
        )) return;

        words.push({

          id: d.id || (
            Date.now().toString(36) +
            Math.random().toString(36).slice(2, 6)
          ),

          word: d.word,
          meaning: d.meaning,

          streak: d.streak || 0,
          wrongCount: d.wrongCount || 0,

          nextDue: d.nextDue || today(),
          lastReviewed: d.lastReviewed || null,
          created: d.created || today()

        });

        added++;

      });

      save();
      renderList();

      alert(`นำเข้าสำเร็จ ${added} คำ`);

    } catch (err) {

      alert('ไฟล์ไม่ถูกต้อง');

    }

    e.target.value = '';

  };

  reader.readAsText(file);

});

/* ================= แท็บ ================= */

document.querySelectorAll('.tabbar button').forEach(tab => {

  tab.addEventListener('click', () => {

    document.querySelectorAll('.tabbar button').forEach(t => {
      t.classList.remove('active');
    });

    document.querySelectorAll('.panel').forEach(p => {
      p.classList.remove('active');
    });

    tab.classList.add('active');

    $(tab.dataset.tab).classList.add('active');

    window.scrollTo(0, 0);

    if (tab.dataset.tab === 'review') buildQueue();

    if (tab.dataset.tab === 'library') renderList();

  });

});

/* ================= เริ่มต้น ================= */

buildQueue();

</script>
